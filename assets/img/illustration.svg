  <path d="M90 120 L120 120 L130 160 L80 160 Z" fill="#818CF8" opacity="0.9"/>
  <line x1="105" y1="160" x2="105" y2="320" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="105" cy="320" rx="25" ry="5" fill="#64748B"/>

  <!-- Wall Clock in Center -->
  <circle cx="210" cy="110" r="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="210" cy="110" r="3" fill="#6366F1"/>
  <line x1="210" y1="110" x2="210" y2="97" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="210" y1="110" x2="222" y2="110" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Potted Plant on Right -->
  <path d="M380 270 L395 320 L365 320 Z" fill="#94A3B8"/>
  <path d="M380 250 Q360 210 350 230 Q370 250 380 270" fill="#3B82F6"/>
  <path d="M380 250 Q400 200 410 225 Q390 250 380 270" fill="#6366F1"/>
  <path d="M380 240 Q380 180 375 220" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <circle cx="375" cy="200" r="10" fill="#34D399"/>
  <circle cx="395" cy="220" r="9" fill="#10B981"/>
  <circle cx="355" cy="225" r="9" fill="#059669"/>

  <!-- Armchair -->
  <rect x="180" y="210" width="150" height="90" rx="16" fill="url(#chairGrad)"/>
  <!-- Armrests -->
  <rect x="165" y="230" width="30" height="60" rx="10" fill="#334155"/>
  <rect x="315" y="230" width="30" height="60" rx="10" fill="#334155"/>
  <!-- Chair legs -->
  <line x1="190" y1="300" x2="180" y2="330" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  <line x1="320" y1="300" x2="330" y2="330" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>

  <!-- Person sitting -->
  <!-- Legs / Pants -->
  <path d="M225 245 L225 310 L250 310 L250 255" fill="#1E293B"/>
  <path d="M255 245 L255 310 L280 310 L280 255" fill="#0F172A"/>
  <!-- Shoes -->
  <path d="M250 310 L265 310 C265 315 245 320 240 315 Z" fill="#EF4444"/>
  <path d="M280 310 L295 310 C295 315 275 320 270 315 Z" fill="#EF4444"/>

  <!-- Torso / Blue Shirt -->
  <path d="M220 180 C220 160 285 160 285 180 L280 250 L225 250 Z" fill="url(#shirtGrad)"/>

  <!-- Head & Hair -->
  <circle cx="250" cy="140" r="17" fill="#FCD34D"/>
  <!-- Hair -->
  <path d="M235 135 C235 120 265 118 267 130 C263 125 245 125 235 135 Z" fill="#1E293B"/>
  <path d="M233 135 Q235 122 250 122 Q265 122 267 135 C263 130 250 128 233 135 Z" fill="#1E293B"/>

  <!-- Arms holding laptop -->
  <path d="M230 190 L255 220 L275 220" stroke="#FCD34D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Laptop -->
  <!-- Base -->
  <polygon points="245,230 295,230 290,236 240,236" fill="#94A3B8"/>
  <!-- Screen -->
  <polygon points="265,190 300,190 295,230 260,230" fill="#334155"/>
  <polygon points="268,193 297,193 293,227 264,227" fill="#60A5FA"/>
  <circle cx="280" cy="210" r="3" fill="#FFFFFF" opacity="0.9"/>
</svg>


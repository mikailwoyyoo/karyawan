<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield / App Icon -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#gradLogo)" filter="drop-shadow(0px 8px 16px rgba(30, 58, 138, 0.35))"/>
  
  <!-- Modern Geometric Human / ID Badge & Check Icon -->
  <!-- ID Badge Body -->
  <rect x="26" y="24" width="48" height="52" rx="10" fill="#FFFFFF" fill-opacity="0.95" />
  
  <!-- Lanyard clip notch -->
  <rect x="42" y="20" width="16" height="7" rx="3.5" fill="#C7D2FE" />
  
  <!-- Avatar silhouette in badge -->
  <circle cx="50" cy="40" r="8" fill="#4F46E5" />
  <path d="M36 57 C36 49, 64 49, 64 57 Z" fill="#6366F1" />
  
  <!-- Mini badge lines -->
  <rect x="36" y="62" width="28" height="3" rx="1.5" fill="#CBD5E1" />
  <rect x="40" y="67" width="20" height="3" rx="1.5" fill="#E2E8F0" />

  <!-- Dynamic Green Check Badge at bottom right -->
  <circle cx="72" cy="72" r="14" fill="#FFFFFF" />
  <circle cx="72" cy="72" r="12" fill="url(#checkGrad)" />
  <path d="M67 72 L70.5 75.5 L77 69" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>

